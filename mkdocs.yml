site_name: Insper Code Jr. - Material Didático
site_description: Material didático para os encontros da Insper Code Jr.
site_author: Insper Code Jr.

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: pt-BR
  logo: img/back.png
  favicon: img/favicon.ico
  font: false
  palette:
    # Modo claro
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo escuro
    # Modo escuro
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

nav:
  - Início: index.md
  - Cronograma:
      - Visão geral: cronograma.md
      - Entregáveis por reunião: reunioes.md
  - Presença e horas: combinados.md
  - Utilidades: etiqueta.md
  - Aulas: aulas.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search
